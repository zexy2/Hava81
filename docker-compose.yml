services:
  weather-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=4000
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:?OPENWEATHER_API_KEY is required}
      - CORS_ORIGINS=http://localhost:3000
    ports:
      - "4000:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - weather-network

  weather-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      weather-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - weather-network

  # Development service
  weather-app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:4000/api/v1
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      weather-api:
        condition: service_healthy
    profiles:
      - dev
    networks:
      - weather-network

networks:
  weather-network:
    driver: bridge
