name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

permissions:
  contents: read

concurrency:
  group: hava81-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit
      # Frontend dev tooling also ships in CI and previously contained audit
      # findings. Audit the entire locked graph, not only production packages.
      - name: Audit all frontend dependencies (including dev tooling)
        env:
          NPM_AUDIT_MAX_ATTEMPTS: '2'
          NPM_AUDIT_ATTEMPT_TIMEOUT_SECONDS: '60'
          NPM_AUDIT_ALLOW_TRANSIENT_UNAVAILABLE: '1'
        run: bash scripts/run-npm-audit-with-retry.sh npm audit --audit-level=high
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:ci
      - name: Preserve frontend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  dev-image:
    name: Development container build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build development image without publishing it
        run: docker build --pull --file Dockerfile.dev --tag hava81-dev:ci .
      - name: Smoke-test the development server
        shell: bash
        run: |
          set -euo pipefail
          container_name="hava81-dev-smoke-${GITHUB_RUN_ID}"
          docker run --detach --name "$container_name" --publish 127.0.0.1:4173:3000 hava81-dev:ci
          cleanup() { docker rm --force "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              echo "Development server responded over HTTP on attempt ${attempt}."
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_name"
          echo 'Development container did not serve HTTP within 30 seconds.' >&2
          exit 1

  api:
    name: API test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --prefix apps/api --no-audit
      - name: Audit API dependencies
        env:
          NPM_AUDIT_MAX_ATTEMPTS: '2'
          NPM_AUDIT_ATTEMPT_TIMEOUT_SECONDS: '60'
          NPM_AUDIT_ALLOW_TRANSIENT_UNAVAILABLE: '1'
        run: bash scripts/run-npm-audit-with-retry.sh npm audit --prefix apps/api --audit-level=high
      - run: npm run api:type-check
      - run: npm run api:test
      - run: npm run api:build

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Build and test in parallel; downstream publish jobs retain strict gates.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Validate all generated province SEO metadata
        run: node scripts/verify-generated-seo.mjs
      - name: Reject public source maps
        run: test -z "$(find dist -type f -name *.map -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  browser:
    name: Browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Ensure Playwright Chromium is present
        run: npx playwright install chromium
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npm run e2e

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit
      # Build a separate, non-deployed variant. The production dist artifact uses
      # the public API origin, which rejects the local preview origin by CORS.
      # Lighthouse runs the same API source locally with the repository's real
      # OpenWeather credential, so CI does not depend on Oracle ingress or fake data.
      - name: Build Lighthouse variant with same-origin API routing
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
      - name: Install API dependencies for live-weather Lighthouse
        run: npm ci --prefix apps/api --no-audit
      - name: Build local API for live-weather Lighthouse
        run: npm run api:build
      - name: Validate Lighthouse browser selection
        run: node scripts/test-lighthouse-chrome-selection.mjs
      - name: Validate Lighthouse target-path safety
        run: node scripts/test-lighthouse-target-url.mjs
      - name: Validate real-weather readiness and bounded confirmation
        run: node scripts/test-lighthouse-weather-readiness.mjs
      - name: Validate Lighthouse preview API proxy contract
        run: node scripts/test-lighthouse-preview-proxy.mjs
      - name: Validate Lighthouse workflow artifact contract
        run: python3 scripts/test-lighthouse-artifact-contract.py
      - name: Measure the built UI through the live-weather API proxy
        run: |
          set -euo pipefail
          if [ -z "${OPENWEATHER_API_KEY:-}" ]; then
            echo "OPENWEATHER_API_KEY secret is required for real-weather Lighthouse; refusing a synthetic fallback." >&2
            exit 1
          fi

          api_log="$RUNNER_TEMP/hava81-lighthouse-api.log"
          ready_file="$RUNNER_TEMP/hava81-lighthouse-api-ready.json"
          weather_file="$RUNNER_TEMP/hava81-lighthouse-api-weather.json"
          OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY" \
            NODE_ENV=production HOST=127.0.0.1 PORT=4000 \
            CORS_ORIGINS=http://127.0.0.1:4173 \
            node apps/api/dist/src/server.js >"$api_log" 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          unset OPENWEATHER_API_KEY
          export HAVA81_PREVIEW_API_PROXY_TARGET=http://127.0.0.1:4000

          api_ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 2 \
              http://127.0.0.1:4000/api/v1/health/ready -o "$ready_file"; then
              if node -e 'const d = require(process.argv[1]); if (d.status !== "ready") process.exit(1)' "$ready_file"; then
                api_ready=true
                break
              fi
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$api_ready" != true ]; then
            echo "Local live-weather API did not become ready for Lighthouse." >&2
            tail -n 30 "$api_log" | sed -E 's/(appid=)[^&[:space:]]+/\1[redacted]/g'
            exit 1
          fi

          # Prime and validate the real provider response before browser measurement.
          # Lighthouse still enforces its own successful current-weather request gate.
          if ! curl --silent --show-error --fail --max-time 20 \
            'http://127.0.0.1:4000/api/v1/weather/current?city=Istanbul&units=metric&lang=en' \
            -o "$weather_file"; then
            echo "Local API could not return live current weather from OpenWeather." >&2
            tail -n 30 "$api_log" | sed -E 's/(appid=)[^&[:space:]]+/\1[redacted]/g'
            exit 1
          fi
          if ! node -e 'const d = require(process.argv[1]); if (typeof d.cityName !== "string" || !Number.isFinite(d.temperature) || typeof d.timestamp !== "string" || typeof d.meta?.provider !== "string" || typeof d.meta?.fetchedAt !== "string") process.exit(1); console.log(`Live weather preflight: ${d.cityName}, provider=${d.meta.provider}, fetchedAt=${d.meta.fetchedAt}`)' "$weather_file"; then
            echo "Live weather preflight response did not satisfy the current-weather contract." >&2
            exit 1
          fi
          npm run lighthouse
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      - name: Preserve Lighthouse JSON reports (including failed budgets)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouse-results/*.json
          # upload-artifact excludes dot-directories by default; keep the report files.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Do not publish Pages until both quality gates and all UI checks pass.
    needs: [quality, api, build, browser, lighthouse]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Retain recent Pages asset generations
        run: bash scripts/prepare-pages-deploy.sh dist
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
      - name: Verify public static shell
        env:
          HAVA81_PUBLIC_URL: https://hava81.zekiakgul.dev
          # GitHub Pages custom-domain propagation can remain on the prior cached shell
          # for several minutes after gh-pages is updated. Keep exact-hash verification,
          # but allow a bounded ~10 minute edge-propagation window before failing deploy.
          HAVA81_SMOKE_ATTEMPTS: 120
        run: bash scripts/verify-public-shell.sh
      - name: Verify all 81 published province SEO pages
        env:
          HAVA81_PUBLIC_URL: https://hava81.zekiakgul.dev
          HAVA81_PUBLIC_SEO_ATTEMPTS: '3'
        run: node scripts/verify-public-seo.mjs
