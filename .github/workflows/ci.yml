name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

permissions:
  contents: read

concurrency:
  group: hava81-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit
      # Frontend dev tooling also ships in CI and previously contained audit
      # findings. Audit the entire locked graph, not only production packages.
      - name: Audit all frontend dependencies (including dev tooling)
        env:
          NPM_AUDIT_MAX_ATTEMPTS: '2'
          NPM_AUDIT_ATTEMPT_TIMEOUT_SECONDS: '60'
          NPM_AUDIT_ALLOW_TRANSIENT_UNAVAILABLE: '1'
        run: bash scripts/run-npm-audit-with-retry.sh npm audit --audit-level=high
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:ci
      - name: Preserve frontend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  dev-image:
    name: Development container build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Build development image without publishing it
        run: docker build --pull --file Dockerfile.dev --tag hava81-dev:ci .

  api:
    name: API test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --prefix apps/api --no-audit
      - name: Audit API dependencies
        env:
          NPM_AUDIT_MAX_ATTEMPTS: '2'
          NPM_AUDIT_ATTEMPT_TIMEOUT_SECONDS: '60'
          NPM_AUDIT_ALLOW_TRANSIENT_UNAVAILABLE: '1'
        run: bash scripts/run-npm-audit-with-retry.sh npm audit --prefix apps/api --audit-level=high
      - run: npm run api:type-check
      - run: npm run api:test
      - run: npm run api:build

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Build and test in parallel; downstream publish jobs retain strict gates.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Validate all generated province SEO metadata
        run: node scripts/verify-generated-seo.mjs
      - name: Reject public source maps
        run: test -z "$(find dist -type f -name *.map -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  browser:
    name: Browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit
      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Ensure Playwright Chromium is present
        run: npx playwright install chromium
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npm run e2e

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npm run lighthouse
      - name: Preserve Lighthouse JSON reports (including failed budgets)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouse-results/*.json
          # upload-artifact excludes dot-directories by default; keep the report files.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Do not publish Pages until both quality gates and all UI checks pass.
    needs: [quality, api, build, browser, lighthouse]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Retain recent Pages asset generations
        run: bash scripts/prepare-pages-deploy.sh dist
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
      - name: Verify public static shell
        env:
          HAVA81_PUBLIC_URL: https://hava81.zekiakgul.dev
          # GitHub Pages custom-domain propagation can remain on the prior cached shell
          # for several minutes after gh-pages is updated. Keep exact-hash verification,
          # but allow a bounded ~10 minute edge-propagation window before failing deploy.
          HAVA81_SMOKE_ATTEMPTS: 120
        run: bash scripts/verify-public-shell.sh
      - name: Verify all 81 published province SEO pages
        env:
          HAVA81_PUBLIC_URL: https://hava81.zekiakgul.dev
          HAVA81_PUBLIC_SEO_ATTEMPTS: '3'
        run: node scripts/verify-public-seo.mjs
