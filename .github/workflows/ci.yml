name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

permissions:
  contents: read

concurrency:
  group: hava81-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:ci
      - name: Verify safe worktree cleanup contract
        run: bash scripts/test-cleanup-merged-worktree-artifacts.sh
      - name: Verify Hava81 browser temp cleanup contract
        run: bash scripts/test-cleanup-hava81-browser-temp.sh
      - name: Verify production observer contract
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy/oracle/observer -p 'test_*.py'
          python3 - <<'PY'
          from pathlib import Path
          for filename in [
              'deploy/oracle/observer/observer.py',
              'deploy/oracle/observer/hava81-worker-status.py',
          ]:
              compile(Path(filename).read_text(encoding='utf-8'), filename, 'exec')
          PY
      - name: Verify observer installer shell syntax
        run: bash -n deploy/oracle/install-observer.sh
      - name: Preserve frontend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  api:
    name: API test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --prefix apps/api
      - run: npm audit --prefix apps/api --audit-level=high
      - run: npm run api:type-check
      - run: npm run api:test
      - run: npm run api:build
      - name: Verify API deployment shell syntax
        run: bash -n deploy/oracle/deploy-api-blue-green.sh deploy/oracle/switch-api-traffic.sh deploy/oracle/rollback-api.sh
      - name: Verify API deploy operation locking
        run: bash scripts/test-api-operation-lock.sh
      - name: Verify API rollback target state
        run: bash scripts/test-api-rollback-target.sh
      - name: Verify API traffic-switch readiness contract
        run: python3 deploy/oracle/test_validate_api_readiness.py

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, api]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Reject public source maps
        run: test -z "$(find dist -type f -name *.map -print -quit)"
      - name: Verify Pages asset-retention logic
        run: python3 scripts/test_prepare_pages_asset_retention.py
      - name: Verify generated-shell asset discovery
        run: python3 scripts/test_list_html_assets.py
      - name: Verify public-shell smoke syntax
        run: bash -n scripts/verify-public-shell.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  browser:
    name: Browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Ensure Playwright Chromium is present
        run: npx playwright install chromium
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npm run e2e

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npm run lighthouse

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, browser]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/weather-dashboard
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [build, browser, lighthouse]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Retain recent Pages asset generations
        run: bash scripts/prepare-pages-deploy.sh dist
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
      - name: Verify public static shell
        env:
          HAVA81_PUBLIC_URL: https://hava81.zekiakgul.dev
          # GitHub Pages custom-domain propagation can remain on the prior cached shell
          # for several minutes after gh-pages is updated. Keep exact-hash verification,
          # but allow a bounded ~10 minute edge-propagation window before failing deploy.
          HAVA81_SMOKE_ATTEMPTS: 120
        run: bash scripts/verify-public-shell.sh
