name: Visual baselines

# Generates the screenshot baselines for e2e/visual.spec.ts (@visual) on CI
# Linux and uploads them as an artifact. Nothing is committed: download the
# `visual-baselines-linux` artifact, review the PNGs and commit them under
# e2e/visual.spec.ts-snapshots/ in a normal PR (plan 3.x, "Açık kalanlar (3)").
#
# Also runs on PRs that change the visual spec or this workflow, so baseline
# generation is proven before such a change merges.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/visual-baseline.yml'
      - 'e2e/visual.spec.ts'

env:
  NODE_VERSION: '22'

permissions:
  contents: read

concurrency:
  group: hava81-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baselines:
    name: Generate visual baselines (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit
      - name: Install Playwright Chromium (with system dependencies)
        run: npx playwright install --with-deps chromium
      # Same production build the Browser flows job tests (playwright serves dist/
      # through `vite preview`).
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Generate baselines
        env:
          HAVA81_VISUAL: '1'
        run: npm run e2e -- --project=visual --update-snapshots
      - name: List generated baselines
        run: ls -l e2e/visual.spec.ts-snapshots/
      - name: Upload visual baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-linux
          path: e2e/visual.spec.ts-snapshots/*-visual-linux.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
