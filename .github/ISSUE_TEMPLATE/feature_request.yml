name: Feature request
description: Suggest a product or engineering improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: What user problem should Hava81 solve better?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or outcome you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives, trade-offs or examples from other products.
  - type: checkboxes
    id: principles
    attributes:
      label: Product fit
      options:
        - label: This request supports Hava81's decision-first weather experience.
          required: true
