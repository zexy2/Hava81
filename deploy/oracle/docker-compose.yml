services:
  weather-api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:${HOST_PORT:-4000}:4000"
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
