<!doctype html>
<html lang="tr">
  <head>
    <script>
      // Suppress specific Chrome Extension errors (like TronLink)
      window.addEventListener(
        'error',
        function (e) {
          if (
            e.message &&
            (e.message.includes('tronlinkParams') ||
              e.filename.indexOf('chrome-extension://') !== -1)
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        },
        true
      );
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/hava81-mark.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F3F6F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E2C32" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Hava81, Türkiye'nin 81 ili için anlık koşulları, yaklaşan değişimleri ve hava risklerini karar odaklı bir meteorolojik atlas içinde sunar."
    />
    <meta name="application-name" content="Hava81" />
    <meta name="apple-mobile-web-app-title" content="Hava81" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Hava81 — Türkiye'nin Meteorolojik Atlası</title>
  </head>
